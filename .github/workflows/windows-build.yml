name: Build Windows Controller
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows distributable
        run: npx electron-forge make --arch=${{ matrix.arch }}
      - name: Upload installer/artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btc-controller-windows-${{ matrix.arch }}
          path: out/make/**
          if-no-files-found: error
